  - name: 'dwh.Labor_KCBU.KC_Kalium_first_value'
    method: 'nv'
  - name: 'dwh.Labor_KCBU.KC_Harnstoff_first_value'
    method: 'nv'
  - name: 'dwh.Labor_KCBU.KC_Glukose_first_value'
    method: 'nv'
  - name: 'dwh.Labor_KCBU.KC_Chlorid_first_value'
