    method: 'nv'
  - name: 'dwh.Labor_KCBU.KC_Alkalische_Phosphatase_first_value'
    method: 'nv'
  - name: 'dwh.Labor_KCBU.Blutgase_FIO2_first_value'
    method: 'nv'
  - name: 'dwh.Labor_KCBU.Blutgase_paCO2_first_value'
    method: 'nv'
  - name: 'dwh.Labor_KCBU.Blutgase_paO2_first_value'
    method: 'nv'
  - name: 'dwh.Labor_KCBU.KC_Laktat_first_value'
    method: 'nv'
