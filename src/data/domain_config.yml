            method: 'first'
            new_name: 'HbA1c'

      - name: 'dwh Labor Blutgruppe'
        columns_to_keep:
          - 'SPM_ID'
          - 'Blutgruppe'
        columns_to_clean:
          - 'Blutgruppe'
        replace_values:
          - 'nicht auswertbar'
          - 'nicht getestet'
        group_by_columns:
          - 'SPM_ID'
        first_valid_columns:
          - 'Blutgruppe'

      - name: 'dwh Labor Virologie'
        columns_to_keep:
          - 'SPM_ID'
          - 'dwh.Labor_Virologie.Anti_CMV_IgG'
        columns_to_clean:
          - 'dwh.Labor_Virologie.Anti_CMV_IgG'
        replace_values:
          - 'nicht auswertbar'
          - 'nicht getestet'
        group_by_columns:
          - 'SPM_ID'
        first_valid_columns:
          - 'dwh.Labor_Virologie.Anti_CMV_IgG'

  - name: 'Trans_20_24'
    sheets:
      - name: 'dwh Transplantat'
        columns_to_keep:
          - 'dwh.Transplantat.Status_Transplantat'
          - 'dwh.Transplantat.Transplantat'
        method: 'transplantiert_oder_nicht'

encode:
  one_hot: 
    - "Blutgruppe"
    - "dwh.Labor_Virologie.Anti_CMV_IgG"
  posnegmiss:
    - "dwh.Labor_KCBU.Urin_Glukose_first_value"
    - "dwh.Labor_KCBU.Urin_Nitrit_first_value"
    - "dwh.Labor_KCBU.Urin_Sediment_Leukozyten_first_value"
    - "dwh.Labor_KCBU.Urin_Sediment_Bakterien_first_value"
    - "dwh.Labor_KCBU.Urin_HB_first_value"
    - "dwh.Labor_KCBU.Urin_Ketonkoerper_first_value"
  binary:
    - name: "dwh.Spender.Spender_Geschlecht"
      positive: "weiblich"
      negative: "männlich"
  binary_emptyornot:
    - "Hypotension_Diagnose"
    - "Diabetes_Diagnose"
    - "Hepatitis_C_Diagnose"
    - "Drogen_Diagnose"
    - "Reanimation_Diagnose"
  icd:
    - 'Tod_ICD_10_Code'

impute:
  - name: 'dwh.Labor_KCBU.KC_Kreatinin_min_value'
    method: 'median'
  - name: 'Diurese_24h_kgKG'
    method: 'median'  
  - name: 'dwh.Labor_KCBU.KC_Haematokrit_first_value'
    method: 'nv'
  - name: 'dwh.Labor_KCBU.KC_Thrombozyten_first_value'
