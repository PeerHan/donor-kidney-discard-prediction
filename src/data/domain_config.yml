new_dataset_name: 'domain'

organs:
  - 'Niere'

excel_files:
  - name: 'Unter_20_24'
    sheets:
      - name: 'dwh Spender'
        columns_to_keep:
          - 'dwh.Spender.Spender_Alter'
          - 'dwh.Spender.Spender_Geschlecht'
          - 'dwh.Spender.Spender_BMI'
          - 'dwh.Spender.Spender_Gewicht'
      - name: 'dwh Monitoring'
        columns_to_keep:
          - 'dwh.Monitoring.Diurese_Stunden'
          - 'dwh.Monitoring.Diurese_Menge'
          - 'dwh.Monitoring.Erhebung_Zeitpunkt'
        sort_by_columns:
          - 'SPM_ID'
          - 'dwh.Monitoring.Erhebung_Zeitpunkt'
        group_by_columns:
          - 'SPM_ID'
        first_valid_columns:
          - 'dwh.Monitoring.Diurese_Stunden'
          - 'dwh.Monitoring.Diurese_Menge'

  - name: 'Diag_20_24'
    sheets:
      - name: 'dwh Diagnose Tod'
        columns_to_keep:
          - 'Tod_ICD_10_Code'
      - name: 'dwh Diagnose Hypotension'
        columns_to_keep:
          - 'Hypotension_Diagnose'
      - name: 'dwh Diagnose Diabetes'
        columns_to_keep:
          - 'Diabetes_Diagnose'
      - name: 'dwh Diagnose Hepatitis C'
        columns_to_keep:
          - 'Hepatitis_C_Diagnose'
      - name: 'dwh Diagnose Rauchen'
        columns_to_keep:
          - 'SPM_ID'
          - 'Rauchen_ICD_10_Code'
      - name: 'dwh Diagnose Alkohol'
        columns_to_keep:
          - 'SPM_ID'
          - 'Alkohol_ICD_10_Code'
      - name: 'dwh Diagnose Drogen'
        columns_to_keep:
          - 'SPM_ID'
          - 'Drogen_Diagnose'
      - name: 'dwh Diagnose Reanimation'
        columns_to_keep:
          - 'SPM_ID'
          - 'Reanimation_Diagnose_Zeitpunkt_von'
          - 'Reanimation_Diagnose_Zeitpunkt_bis'
          - 'Reanimation_Diagnose'


