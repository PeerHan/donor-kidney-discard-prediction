    method: 'nv'

create:
  - name: 'Diurese_24h_kgKG'
    method: 'norm_stand'
    method2: 'norm'
    zaehler: 'dwh.Monitoring.Diurese_Menge'
    nenner: 'dwh.Monitoring.Diurese_Stunden'
    factor: 24
    stand_with: 'dwh.Spender.Spender_Gewicht'
  - name: 'Reanimation_Dauer'
    method: 'reanimationdauer'

drop: 
  - 'dwh.Spender.Spender_Gewicht'
  - 'Diabetes_Diagnose_Zeitpunkt_von'
  - 'Diabetes_Diagnose_Zeitpunkt_bis'
  - 'Hepatitis_C_Diagnose_Zeitpunkt_von'

scale:
  - name: 'dwh.Labor_KCBU.KC_Kreatinin_min_value' # this is correct for kc kreatinin, but urin kreatinin is mg/l to g/l  (*1000)
    method: 'µmol/L_to_mg/dL'

rename:
  dwh.Spender.Spender_Alter: 'Alter'
  dwh.Spender.Spender_Geschlecht: 'Geschlecht'
  dwh.Spender.Spender_BMI: 'BMI'
  Hypotension_Diagnose: 'Hypotension'
  Diabetes_Diagnose: 'Diabetes'
  Hepatitis_C_Diagnose: 'Hepatitis_C'
